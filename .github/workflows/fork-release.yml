name: Fork Release

# Собирает сборки для вашего форка и кладёт их в Releases.
# НЕ зависит от секретов upstream и не публикует ничего в оригинальный репозиторий.
#
# Как выпустить релиз:
#   1) git tag v5.8.1-fork.1   (любой тег, начинающийся с "v")
#   2) git push origin v5.8.1-fork.1
# или вручную: вкладка Actions -> Fork Release -> Run workflow (укажите имя тега).
#
# Подпись macOS (опционально):
# По умолчанию сборка не подписана — Gatekeeper держит её в карантине.
# Чтобы получить подписанную и нотаризованную сборку (без карантина),
# добавьте в Settings -> Secrets and variables -> Actions:
#   MAC_CERT_P12_BASE64         — сертификат "Developer ID Application" (.p12) в base64:
#                                 base64 -i certificate.p12 | pbcopy
#   MAC_CERT_PASSWORD           — пароль от .p12
#   APPLE_ID                    — Apple ID аккаунта разработчика
#   APPLE_APP_SPECIFIC_PASSWORD — app-specific password (создаётся на appleid.apple.com)
#   APPLE_TEAM_ID               — Team ID (developer.apple.com -> Membership)
# Требуется платная программа Apple Developer. Без секретов workflow работает как раньше.
#
# Установка неподписанной сборки без снятия карантина: скачивание через curl
# (а не браузер) не ставит атрибут com.apple.quarantine — команда есть в
# описании каждого релиза.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Имя тега/релиза, напр. v5.8.1-fork.1 (для ручного запуска)"
        required: true

# Нужно, чтобы встроенный GITHUB_TOKEN мог создавать релиз и загружать ассеты.
permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      # 'true', если добавлен секрет с сертификатом Developer ID (см. шапку файла)
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    strategy:
      # Если одна платформа упадёт — остальные всё равно соберутся и зальются.
      fail-fast: false
      matrix:
        # Уберите ненужные строки, чтобы не собирать лишние платформы.
        os: [macos-14]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install python 3.11 (not Mac)
        if: "!startsWith(matrix.os, 'macos')"
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install python 3.11 (Mac)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install python@3.11
          echo "/opt/homebrew/opt/python@3.11/libexec/bin" >> $GITHUB_PATH

      - name: Install fpm (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo gem install fpm -v 1.17.0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 100000
        env:
          npm_config_node_gyp: ${{ github.workspace }}${{ runner.os == 'Windows' && '\node_modules\node-gyp\bin\node-gyp.js' || '/node_modules/node-gyp/bin/node-gyp.js' }}

      # --publish never => electron-builder просто кладёт файлы в dist_electron,
      # ничего никуда сам не загружает. Заливку делаем ниже своим шагом.
      - name: Build (Linux, AppImage + deb)
        if: startsWith(matrix.os, 'ubuntu')
        run: yarn run electron:build --publish never --linux AppImage deb
        env:
          USE_SYSTEM_FPM: true

      - name: Build (Windows, nsis .exe)
        if: startsWith(matrix.os, 'windows')
        run: yarn run electron:build --publish never --win nsis

      # Если задан секрет MAC_CERT_P12_BASE64 — раскодируем сертификат для подписи.
      - name: Decode macOS signing certificate
        if: startsWith(matrix.os, 'macos') && env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: echo "$MAC_CERT_P12_BASE64" | base64 --decode > ~/mac-certificate.p12

      # С сертификатом: подпись Developer ID + нотаризация (карантин не мешает).
      # Без сертификата (CSC_IDENTITY_AUTO_DISCOVERY=false): сборка неподписанная,
      # при первом запуске нужно ПКМ -> Open или снять карантин:
      #   xattr -cr "/Applications/Beekeeper Studio.app"
      # (либо скачивать через curl — см. описание релиза).
      - name: Build (macOS, .dmg)
        if: startsWith(matrix.os, 'macos')
        run: yarn run electron:build --publish never --mac dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_CERT }}
          CSC_LINK: ${{ env.HAS_MAC_CERT == 'true' && '~/mac-certificate.p12' || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PYTHON_PATH: /opt/homebrew/opt/python@3.11/libexec/bin/python3

      - name: Publish assets to fork release
        uses: softprops/action-gh-release@v2
        with:
          # При пуше тега берём имя тега; при ручном запуске — введённое значение.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          body: |
            Сборка форка.

            ### macOS: установка без снятия карантина
            Если сборка не подписана сертификатом Apple, Gatekeeper блокирует запуск DMG, скачанного браузером. Скачивание через curl не ставит атрибут `com.apple.quarantine`:

            ```bash
            curl -L -o /tmp/bks.dmg "$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }} | grep -o 'https://[^"]*\.dmg' | head -1)" && open /tmp/bks.dmg
            ```

            Если DMG уже скачан браузером, альтернатива после копирования в Applications:
            ```bash
            xattr -cr "/Applications/Beekeeper Studio.app"
            ```
          files: |
            apps/studio/dist_electron/*.AppImage
            apps/studio/dist_electron/*.deb
            apps/studio/dist_electron/*.exe
            apps/studio/dist_electron/*.dmg
